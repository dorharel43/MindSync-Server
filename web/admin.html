<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2f64d6">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MindSync beta</title>
<!-- The owner's beta page (30/9). Data: GET /api/admin/beta, only for the
     owner (ADMIN_USER_IDS / ADMIN_EMAILS) - everyone else gets 404. Uses the login saved by
     the app on this site (localStorage mindsync.token). -->
<style>
  :root {
    --bg: #f7f7f8; --card: #fff; --text: #18181b; --muted: #6b6b76; --line: #e4e4e7;
    --accent: #2f64d6; --good: #15803d; --warn: #b45309; --bad: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --card: #1a1a1d; --text: #ececf1; --muted: #9a9aa5; --line: #2c2c31;
            --accent: #7aa2f7; --good: #4ade80; --warn: #fbbf24; --bad: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  h2 { font-size: 15px; margin: 28px 0 10px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .tile b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--muted); font-size: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 140px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .chart .bar { width: 100%; max-width: 34px; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
  .chart .n { font-size: 11px; color: var(--text); font-variant-numeric: tabular-nums; }
  .chart .d { font-size: 10px; color: var(--muted); margin-top: 4px; white-space: nowrap; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: start; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num { font-variant-numeric: tabular-nums; }
  .yes { color: var(--good); font-weight: 600; } .no { color: var(--muted); }
  .fb { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .fb:last-child { border-bottom: 0; }
  .fb .meta { color: var(--muted); font-size: 12px; }
  .fb .text { white-space: pre-wrap; margin-top: 2px; }
  .msg { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
  a { color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .bar-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .bar-actions .hint { margin: 0; }
  button.danger { background: var(--bad); color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  button.danger[disabled] { opacity: .45; cursor: default; }
  td input[type=checkbox], th input[type=checkbox] { width: 16px; height: 16px; }
</style>
</head>
<body>
<main>
  <h1>MindSync beta</h1>
  <p class="sub" id="sub">Loading…</p>
  <div id="root"></div>
</main>
<script src="/app/admin.js"></script>
</body>
</html>
