# Runs the whole test suite (tests/run.js) on every pull request and on main:
# a real server and MongoDB, a fake Gemini - no AI key, nothing paid.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        # (the official image, from the public ECR mirror - Docker Hub limits
        # anonymous pulls, and a refused pull failed CI before any test ran)
        image: public.ecr.aws/docker/library/mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_MONGO: mongodb://127.0.0.1:27017
